; Значения приближены к типичным лимитам shared хостинга, чтобы упереться в них
; локально, а не на проде.
memory_limit = 256M
max_execution_time = 30
post_max_size = 16M
upload_max_filesize = 8M

display_errors = Off
log_errors = On
error_log = /dev/stderr

date.timezone = UTC

; Приближено к типичным настройкам shared хостинга. Важно для деплоя через
; симлинки: после переключения current часть воркеров ещё какое-то время
; разрешает путь в старый релиз. Отсюда правило «релизы иммутабельны, предыдущий
; не удалять сразу» — и оно должно проверяться локально, а не только на проде.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
realpath_cache_size = 4096k
realpath_cache_ttl = 120
