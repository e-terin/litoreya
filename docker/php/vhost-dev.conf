# Dev-режим: Apache отдаёт только Laravel API.
# Статику в этом режиме отдаёт dev-сервер Next.js и проксирует сюда /api.
<VirtualHost *:80>
    DocumentRoot /var/www/laravel/public

    <Directory /var/www/laravel/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
