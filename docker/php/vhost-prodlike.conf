# Prod-like: точная копия раскладки хостинга.
#
# DocumentRoot — аналог папки домена: симлинк на public/ текущего релиза.
# На хостинге она называется по имени сайта, здесь — нейтральным webroot.
# Код приложения лежит рядом и наружу не виден.
#
# DirectoryIndex здесь НЕТ намеренно: на хостинге vhost нам не принадлежит,
# поэтому директива обязана приезжать из .htaccess. Задав её тут, мы тестировали
# бы конфигурацию, которой в проде не будет.
<VirtualHost *:80>
    DocumentRoot /var/www/hosting/webroot

    <Directory /var/www/hosting>
        AllowOverride All
        Require all granted
        # Путь к релизу идёт через два симлинка: webroot → current → releases/<ts>.
        # Префиксы обязательны у всех значений сразу — Apache не даёт смешивать.
        Options +FollowSymLinks -Indexes
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
