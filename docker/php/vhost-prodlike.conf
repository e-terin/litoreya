# Prod-like режим: точная копия раскладки shared хостинга.
# DocumentRoot = public_html, код Laravel лежит рядом и наружу не виден.
# Единственный способ проверить .htaccess и SPA-fallback до деплоя.
<VirtualHost *:80>
    DocumentRoot /var/www/public_html

    <Directory /var/www/public_html>
        # На хостинге AllowOverride All — воспроизводим, иначе .htaccess не проверяется
        AllowOverride All
        Require all granted

        # index.html первым: корень сайта — это SPA, а не PHP
        DirectoryIndex index.html index.php
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
